plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Litematica and MaLiLib (1.20.4 builds) from Modrinth.
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
    // Alloy UI (theme + widget toolkit): ./gradlew publishToMavenLocal in ../alloy-ui
    mavenLocal {
        content { includeModule 'dev.steelaspect', 'alloy-ui' }
    }
    maven {
        name = 'FallenBreathReleases'
        url = 'https://maven.fallenbreath.me/releases'
        content { includeGroup 'me.fallenbreath' }
    }
}

// src/main is the common + server part (the optional placement helper) and is all a dedicated server loads.
// src/client is the printer itself and only runs on a physical client with Litematica installed.
loom {
    splitEnvironmentSourceSets()
    mods {
        'cytraprinter' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Client only at runtime; the jar never requires them on a server.
    modImplementation "maven.modrinth:litematica:${project.litematica_modrinth_id}"
    modImplementation "maven.modrinth:malilib:${project.malilib_modrinth_id}"
    // Optional: Mod Menu's config button opens the printer settings.
    // 9.2.0 pulls a placeholder-api pre-release no repo serves, so no transitive deps.
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

    // Nocturne settings screen; bundled jar-in-jar.
    modImplementation "dev.steelaspect:alloy-ui:${project.alloyui_version}"
    include "dev.steelaspect:alloy-ui:${project.alloyui_version}"

    // Optional Alloy Hub page. Compile-only; only loaded when the Hub is installed.
    modCompileOnly fileTree(dir: 'libs', include: 'alloy-hub-*.jar')
    // -PwithHub: dev runs/tests with Alloy Hub installed
    if (project.hasProperty('withHub')) {
        modLocalRuntime fileTree(dir: 'libs', include: 'alloy-hub-*.jar')
    }
}

// MaLiLib ships conditional-mixin as a jar-in-jar, which Loom doesn't unpack for dev runs.
dependencies {
    modLocalRuntime "me.fallenbreath:conditional-mixin-fabric:${project.conditional_mixin_version}"
}

// The 1.21.11 client game test needs fabric-client-gametest-api-v1 (1.21.4+), so on 1.20.4 src/smoketest is a small
// client mod run by ./smoketest.sh (through ./headless.sh). It prints every placement state of the test blocks in a
// singleplayer world and on dedicated 1.20.4 servers with and without the helper, and logs [PrinterSmoke] PASS/FAIL.
sourceSets {
    smoketest {
        compileClasspath += client.compileClasspath + client.output + main.output
        runtimeClasspath += client.runtimeClasspath + client.output + main.output
    }
}

loom {
    mods {
        'cytraprinter-smoke' { sourceSet sourceSets.smoketest }
    }
    runs {
        smokeTest {
            client()
            name 'Smoke test'
            source sourceSets.smoketest
            runDir 'build/run/smoke'
            vmArg '-Dcytraprinter.smoke=true'
            programArgs '--username', 'PrinterSmoke'
            ideConfigGenerated false
        }
    }
}

processResources {
    def props = [
            version           : project.version,
            minecraft_version : project.minecraft_version,
            litematica_version: project.litematica_version,
            malilib_version   : project.malilib_version
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// CYTRA_PRINTER_DEBUG=1 logs every spot the printer can't solve during the smoke test.
tasks.matching { it.name == 'runSmokeTest' }.configureEach {
    if (System.getenv('CYTRA_PRINTER_DEBUG')) jvmArgs '-Dcytraprinter.debug=true'
    ['CYTRA_TEST_BLOCKS', 'CYTRA_TEST_ONLY', 'SMOKE_PORT', 'SMOKE_PLAIN_PORT'].each { if (System.getenv(it)) environment it, System.getenv(it) }
    // Test games start muted.
    doFirst {
        def options = file('build/run/smoke/options.txt')
        options.parentFile.mkdirs()
        def lines = options.exists() ? options.readLines().findAll { !it.startsWith('soundCategory_master:') } : []
        options.text = (lines + 'soundCategory_master:0.0').join('\n') + '\n'
    }
}
